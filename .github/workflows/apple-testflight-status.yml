name: Apple TestFlight status
# Read-only: prints recent builds and beta groups from App Store Connect. Changes nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: macos-15
    environment: production
    timeout-minutes: 15
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_DISABLE_COLORS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Show recent TestFlight builds and beta groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios build_status
