name: iOS checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Photo engine regression tests
        run: ./scripts/test.sh
      - name: iPhone simulator tests
        shell: bash
        run: |
          set -euo pipefail
          export MELLOW_SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r,ds in d["devices"].items() if "iOS" in r for x in ds if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          ./scripts/build-ios.sh test
      - name: Unsigned iPhone Release build and bundle verification
        run: ./scripts/build-ios.sh device
      - name: Preserve failing iPhone test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ios-tests.*/Tests.xcresult
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
