name: Apple TestFlight distribute
# Distributes an already uploaded build to the internal group now and submits it
# for external beta review. Does not upload, build, or touch any App Store version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, e.g. 1.1.0'
        required: true
      build:
        description: 'Build number, e.g. 3.1'
        required: true
permissions:
  contents: read
concurrency:
  group: ios-app-store-release
  cancel-in-progress: false
jobs:
  distribute:
    runs-on: macos-15
    environment: production
    timeout-minutes: 20
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_DISABLE_COLORS: '1'
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Distribute to TestFlight groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: bundle exec fastlane ios distribute
