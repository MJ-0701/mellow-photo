name: Apple release
on:
  push:
    tags: ['apple-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (for example 1.0.0)'
        required: true
        type: string
      submit_for_review:
        description: 'Submit to Apple review (store metadata must be complete)'
        type: boolean
        default: false
      automatic_release:
        description: 'Publish automatically AFTER Apple approves'
        type: boolean
        default: false
      mode:
        description: 'testflight uploads to TestFlight only, appstore also updates the App Store version'
        type: choice
        options:
          - testflight
          - appstore
        default: testflight
permissions:
  contents: read
concurrency:
  group: ios-app-store-release
  cancel-in-progress: false
jobs:
  release:
    if: vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: macos-15
    environment: production
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_DISABLE_COLORS: '1'
      VERSION_INPUT: ${{ inputs.version }}
      RELEASE_MODE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.IOS_RELEASE_MODE }}
      SUBMIT_FOR_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_for_review || github.event_name == 'push' && vars.IOS_AUTO_SUBMIT == 'true' }}
      AUTOMATIC_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.automatic_release || github.event_name == 'push' && vars.IOS_AUTO_RELEASE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # 배포 모드를 테스트 전에 확정해, 잘못된 값이면 긴 빌드 없이 바로 멈춘다.
      - name: Resolve release lane
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_MODE_INPUT" in
            ''|testflight) lane=beta ;;
            appstore) lane=release ;;
            *) echo "Unknown release mode '$RELEASE_MODE_INPUT'. Use testflight or appstore (repo variable IOS_RELEASE_MODE or workflow input mode)."; exit 1 ;;
          esac
          echo "RELEASE_LANE=$lane" >> "$GITHUB_ENV"
          echo "Release mode '${RELEASE_MODE_INPUT:-testflight}' -> fastlane lane '$lane'"
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < apple/.xcodegen-version)"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${version}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          sudo mkdir -p /usr/local/bin /usr/local/share
          sudo cp "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" /usr/local/bin/xcodegen
          sudo cp -R "$RUNNER_TEMP/xcodegen/xcodegen/share/xcodegen" /usr/local/share/
          xcodegen --version
      - name: Validate release and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#apple-v}"
          else
            version="$VERSION_INPUT"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected version X.Y.Z'; exit 1; }
          grep -qx "MARKETING_VERSION = $version" apple/Config/Version.xcconfig || { echo "apple/Config/Version.xcconfig의 MARKETING_VERSION이 $version과 다릅니다. scripts/release.sh apple $version 으로 태그를 만드세요."; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          /usr/bin/ruby fastlane/test/release_notes_test.rb
          ./scripts/test-apple.sh
      - name: Preserve failing iPhone test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: apple/build/Logs/Test
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      # App Store 업로드는 되돌릴 수 없으므로 Mac 패키지를 먼저 만든다. 업로드가 실패해도 산출물은 남는다.
      - name: Mac package (ad-hoc signed)
        run: MELLOW_BUILD_NUMBER="$APP_BUILD" ./scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mellow-photo-mac-${{ env.APP_VERSION }}
          path: dist/Mellow-Photo-Mac.zip*
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Archive, validate signature, and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: bundle exec fastlane ios "$RELEASE_LANE"
      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mellow-release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/mellow-signing"
          # This is an ephemeral GitHub-hosted runner, never a developer's keychain.
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/mellow-ci.mobileprovision"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/mellow-ci.mobileprovision"
